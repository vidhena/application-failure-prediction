apiVersion: apps/v1
kind: Deployment
metadata:
  name: failure-prediction-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: failure-prediction
  template:
    metadata:
      labels:
        app: failure-prediction
    spec:
      containers:
        - name: application
          image: failure-prediction-app:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 20